<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    /* Dark mode default - bright, luminous parchment clouds on dark sky */
    .c-fill { fill: #f8f6f0; }
    .c-line { fill: none; stroke: #2a241e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .c-swirl { fill: none; stroke: #453a2f; stroke-width: 1.8; stroke-linecap: round; }
    .c-tail { fill: #f8f6f0; stroke: #2a241e; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- ========================================================
       Cloud 1 (Far Left / Brand side) - Large, elegant sweeping tail
       ======================================================== -->
  <g transform="translate(40, 25)" filter="url(#cloud-glow)">
    <!-- Main billowing cloud body -->
    <path class="c-fill" d="M 0 55 C 0 32, 18 16, 42 18 C 45 4, 68 -6, 95 2 C 108 -6, 132 -4, 144 12 C 158 6, 178 14, 180 32 C 196 34, 204 50, 198 68 C 194 84, 172 92, 150 88 C 130 94, 95 94, 70 88 C 45 92, 18 90, 0 75 Z"/>
    <path class="c-line" d="M 0 55 C 0 32, 18 16, 42 18 C 45 4, 68 -6, 95 2 C 108 -6, 132 -4, 144 12 C 158 6, 178 14, 180 32 C 196 34, 204 50, 198 68 C 194 84, 172 92, 150 88 C 130 94, 95 94, 70 88 C 45 92, 18 90, 0 75 Z"/>
    
    <!-- Iconic inner Asian cloud swirls / spirals -->
    <path class="c-swirl" d="M 32 46 C 26 36, 36 26, 48 32 C 44 22, 58 14, 68 24"/>
    <path class="c-swirl" d="M 88 52 C 80 38, 96 28, 110 38 C 104 26, 120 18, 130 30"/>
    <path class="c-swirl" d="M 148 48 C 144 38, 156 32, 166 40 C 166 28, 180 30, 182 42"/>

    <!-- Sweeping tail going right into horizon -->
    <path class="c-tail" d="M 190 52 C 215 48, 245 44, 280 52 C 295 48, 325 50, 318 60 C 305 70, 275 68, 250 62 C 230 66, 200 64, 192 58 Z"/>
    <path class="c-swirl" d="M 230 56 C 228 50, 240 46, 252 52"/>
  </g>

  <!-- ========================================================
       Cloud 2 (Mid-Left High) - Small drifting puff with tail
       ======================================================== -->
  <g transform="translate(330, 8)" filter="url(#cloud-glow)">
    <path class="c-fill" d="M 0 35 C 0 20, 14 10, 30 12 C 34 2, 52 -4, 70 4 C 80 0, 96 4, 100 18 C 112 16, 122 26, 118 40 C 112 50, 96 54, 80 50 L 0 50 Z"/>
    <path class="c-line" d="M 0 35 C 0 20, 14 10, 30 12 C 34 2, 52 -4, 70 4 C 80 0, 96 4, 100 18 C 112 16, 122 26, 118 40 C 112 50, 96 54, 80 50 L 0 50 Z"/>
    <path class="c-swirl" d="M 24 32 C 20 24, 28 16, 38 24 C 36 14, 48 10, 56 20"/>
    <path class="c-swirl" d="M 76 34 C 74 24, 84 18, 94 26"/>
    <!-- Tail -->
    <path class="c-tail" d="M 116 34 C 132 30, 155 32, 170 38 C 172 44, 155 48, 138 44 C 128 46, 118 42, 116 38 Z"/>
    <path class="c-swirl" d="M 136 38 C 134 32, 144 30, 150 36"/>
  </g>

  <!-- ========================================================
       Cloud 3 (Center Top) - Broad majestic cloud overlooking center
       ======================================================== -->
  <g transform="translate(520, 18)" filter="url(#cloud-glow)">
    <path class="c-fill" d="M 0 45 C 0 26, 18 12, 42 14 C 48 2, 70 -6, 96 2 C 108 -6, 132 -2, 142 12 C 158 8, 178 18, 174 36 C 188 38, 196 52, 188 68 C 180 82, 160 88, 140 85 C 115 90, 80 90, 55 84 C 30 88, 10 84, 0 70 Z"/>
    <path class="c-line" d="M 0 45 C 0 26, 18 12, 42 14 C 48 2, 70 -6, 96 2 C 108 -6, 132 -2, 142 12 C 158 8, 178 18, 174 36 C 188 38, 196 52, 188 68 C 180 82, 160 88, 140 85 C 115 90, 80 90, 55 84 C 30 88, 10 84, 0 70 Z"/>
    <path class="c-swirl" d="M 32 40 C 26 30, 36 20, 48 28 C 44 18, 58 10, 68 20"/>
    <path class="c-swirl" d="M 88 44 C 82 32, 98 24, 110 34 C 106 22, 122 16, 132 26"/>
    <path class="c-swirl" d="M 148 42 C 144 32, 156 26, 166 34"/>
  </g>

  <!-- ========================================================
       Cloud 4 (Center Low) - Floating pod beneath nav
       ======================================================== -->
  <g transform="translate(680, 95)" filter="url(#cloud-glow)">
    <path class="c-fill" d="M 0 38 C 0 22, 14 12, 32 14 C 36 2, 55 -4, 75 4 C 86 0, 104 6, 106 20 C 118 20, 128 32, 122 46 C 115 58, 98 62, 80 58 L 0 56 Z"/>
    <path class="c-line" d="M 0 38 C 0 22, 14 12, 32 14 C 36 2, 55 -4, 75 4 C 86 0, 104 6, 106 20 C 118 20, 128 32, 122 46 C 115 58, 98 62, 80 58 L 0 56 Z"/>
    <path class="c-swirl" d="M 26 32 C 22 22, 32 16, 42 24 C 40 14, 52 8, 62 18"/>
    <path class="c-swirl" d="M 82 34 C 78 24, 90 18, 100 28"/>
    <!-- Tail -->
    <path class="c-tail" d="M 120 36 C 145 32, 175 34, 195 42 C 196 48, 178 52, 155 48 C 140 50, 125 46, 120 42 Z"/>
    <path class="c-swirl" d="M 150 42 C 148 34, 160 32, 168 38"/>
  </g>

  <!-- ========================================================
       Cloud 5 (Right side / CTA controls area) - Grand billowing cloud
       ======================================================== -->
  <g transform="translate(940, 20)" filter="url(#cloud-glow)">
    <path class="c-fill" d="M 0 50 C 0 28, 18 14, 44 16 C 50 2, 74 -6, 102 2 C 114 -6, 138 -2, 148 14 C 166 8, 188 18, 186 36 C 200 40, 208 55, 200 72 C 192 88, 170 94, 148 90 C 122 96, 85 96, 58 90 C 30 94, 12 88, 0 74 Z"/>
    <path class="c-line" d="M 0 50 C 0 28, 18 14, 44 16 C 50 2, 74 -6, 102 2 C 114 -6, 138 -2, 148 14 C 166 8, 188 18, 186 36 C 200 40, 208 55, 200 72 C 192 88, 170 94, 148 90 C 122 96, 85 96, 58 90 C 30 94, 12 88, 0 74 Z"/>
    <path class="c-swirl" d="M 34 42 C 28 30, 40 20, 52 28 C 48 18, 62 10, 74 20"/>
    <path class="c-swirl" d="M 94 45 C 88 32, 104 22, 118 34 C 112 20, 130 14, 140 26"/>
    <path class="c-swirl" d="M 156 44 C 152 32, 166 26, 176 36"/>

    <!-- Long flowing tail trailing leftwards and downwards -->
    <path class="c-tail" d="M 0 58 C -25 54, -60 58, -90 68 C -98 74, -80 78, -55 74 C -35 76, -15 70, 0 66 Z"/>
    <path class="c-swirl" d="M -45 68 C -42 62, -56 60, -64 66"/>
  </g>

  <!-- ========================================================
       Cloud 6 (Far Right Edge) - Tail sweeping off-screen
       ======================================================== -->
  <g transform="translate(1200, 35)" filter="url(#cloud-glow)">
    <path class="c-fill" d="M 0 40 C 0 24, 15 14, 34 16 C 40 4, 60 -2, 80 6 C 90 2, 106 6, 110 20 C 122 20, 132 32, 126 46 C 120 58, 102 62, 85 60 L 0 58 Z"/>
    <path class="c-line" d="M 0 40 C 0 24, 15 14, 34 16 C 40 4, 60 -2, 80 6 C 90 2, 106 6, 110 20 C 122 20, 132 32, 126 46 C 120 58, 102 62, 85 60 L 0 58 Z"/>
    <path class="c-swirl" d="M 28 34 C 24 24, 34 18, 44 26 C 42 16, 54 10, 64 20"/>
    <path class="c-swirl" d="M 86 36 C 82 26, 94 20, 104 30"/>
    <!-- Tail heading off edge -->
    <path class="c-tail" d="M 124 38 C 150 34, 185 36, 220 44 C 224 50, 200 54, 175 50 C 155 52, 135 48, 124 44 Z"/>
    <path class="c-swirl" d="M 160 44 C 158 38, 170 34, 180 40"/>
  </g>

  <!-- ========================================================
       Cloud 7 (Bottom Center Drift) - Ambient lower wisp
       ======================================================== -->
  <g transform="translate(240, 120)" filter="url(#cloud-glow)">
    <path class="c-fill" d="M 0 30 C 0 16, 12 8, 26 10 C 30 2, 46 -4, 62 4 C 70 0, 85 4, 88 16 C 98 16, 106 26, 102 36 C 96 46, 80 50, 66 48 L 0 46 Z"/>
    <path class="c-line" d="M 0 30 C 0 16, 12 8, 26 10 C 30 2, 46 -4, 62 4 C 70 0, 85 4, 88 16 C 98 16, 106 26, 102 36 C 96 46, 80 50, 66 48 L 0 46 Z"/>
    <path class="c-swirl" d="M 20 26 C 18 18, 26 14, 34 20"/>
    <path class="c-swirl" d="M 52 28 C 50 20, 60 16, 68 22"/>
    <!-- Tail -->
    <path class="c-tail" d="M 100 28 C 120 24, 145 26, 160 32 C 162 38, 145 40, 130 38 L 100 34 Z"/>
  </g>
</svg>
