<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 130" width="100%" height="100%" preserveAspectRatio="none" class="anime-cloud-svg">
  <defs>
    <!-- Studio Ghibli Anime Cloud Gradients -->
    <linearGradient id="animeCloudBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#fbfdff" />
      <stop offset="80%" stop-color="#eaf3ff" />
      <stop offset="100%" stop-color="#d5e7fd" />
    </linearGradient>
    <linearGradient id="animeCloudShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dcebff" stop-opacity="0" />
      <stop offset="65%" stop-color="#c7dffc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#b3d2fa" stop-opacity="0.95" />
    </linearGradient>
    <!-- Soft volumetric highlight -->
    <radialGradient id="cloudHighlightLeft" cx="15%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cloudHighlightRight" cx="85%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Filter for Hand-Drawn Anime Paper / Shadow Drop -->
  <g class="anime-cloud-group">
    <!-- Main Cloud Silhouette Body with Anime Hand-Drawn Scalloped Lobes -->
    <path class="cloud-contour-base" d="
      M 75,54
      C 48,34 32,50 24,66
      C 12,82 28,98 56,98
      C 42,107 72,118 114,113
      C 146,120 196,121 238,113
      C 278,121 348,119 390,111
      C 432,120 512,121 562,112
      C 604,121 694,120 736,111
      C 778,120 858,119 898,112
      C 938,119 976,111 992,98
      C 1010,84 1010,66 994,52
      C 1010,38 988,20 956,24
      C 934,8 882,6 846,17
      C 808,4 742,3 700,15
      C 658,3 576,2 534,15
      C 492,2 410,3 368,15
      C 326,3 244,4 202,17
      C 160,6 102,10 74,30
      C 52,30 46,44 58,54
      Z
    " fill="url(#animeCloudBody)" stroke="#1e293b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Cel-Shaded Bottom Puffy Shadow Volume -->
    <path class="cloud-contour-shadow" d="
      M 35,82
      C 42,107 72,118 114,113
      C 146,120 196,121 238,113
      C 278,121 348,119 390,111
      C 432,120 512,121 562,112
      C 604,121 694,120 736,111
      C 778,120 858,119 898,112
      C 938,119 976,111 992,98
      C 970,105 910,95 860,90
      C 790,84 710,96 640,88
      C 560,82 480,94 400,86
      C 320,80 240,94 170,86
      C 110,80 60,92 35,82
      Z
    " fill="url(#animeCloudShadow)" />

    <!-- Pure White Volumetric Cloud Crown Lobes (Studio Ghibli Highlights) -->
    <ellipse cx="200" cy="35" rx="110" ry="22" fill="#ffffff" opacity="0.9" />
    <ellipse cx="534" cy="32" rx="140" ry="22" fill="#ffffff" opacity="0.95" />
    <ellipse cx="846" cy="35" rx="120" ry="22" fill="#ffffff" opacity="0.9" />

    <!-- Hand-Drawn Anime Wisp Accent Arcs (Cel Sketch Linework) -->
    <path d="M 140,42 C 165,32 195,35 210,48" fill="none" stroke="#a5c7f4" stroke-width="2" stroke-linecap="round" />
    <path d="M 470,38 C 505,28 555,29 580,44" fill="none" stroke="#a5c7f4" stroke-width="2" stroke-linecap="round" />
    <path d="M 790,42 C 825,32 865,34 885,46" fill="none" stroke="#a5c7f4" stroke-width="2" stroke-linecap="round" />

    <!-- Bottom cel shading lines -->
    <path d="M 260,94 C 290,104 330,104 360,96" fill="none" stroke="#93bdf5" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 610,95 C 645,105 685,104 715,96" fill="none" stroke="#93bdf5" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>